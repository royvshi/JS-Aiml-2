<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon Clone</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #e3e6e6;
    }

    .navbar {
      height: 60px;
      background: #131921;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 15px;
      gap: 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #ff9900;
    }

    .search-box {
      display: flex;
      flex: 1;
    }

    .search-box input {
      width: 100%;
      padding: 10px;
      border: none;
      font-size: 16px;
    }

    .search-box button {
      padding: 10px 18px;
      border: none;
      background: #febd69;
      cursor: pointer;
      font-weight: bold;
    }

    .nav-item {
      font-size: 14px;
      cursor: pointer;
    }

    .cart {
      font-weight: bold;
    }

    .menu {
      background: #232f3e;
      color: white;
      padding: 10px 20px;
      display: flex;
      gap: 25px;
      font-size: 14px;
    }

    .hero {
      background: linear-gradient(to bottom, #89cff0, #e3e6e6);
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      font-weight: bold;
      color: #111;
      text-align: center;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 5px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
    }

    .card h3 {
      margin: 10px 0;
      font-size: 18px;
    }

    .price {
      color: #b12704;
      font-size: 20px;
      font-weight: bold;
      margin: 8px 0;
    }

    .card button {
      background: #ffd814;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .card button:hover {
      background: #f7ca00;
    }

    footer {
      background: #131921;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      .navbar {
        flex-wrap: wrap;
        height: auto;
        padding: 10px;
      }

      .menu {
        overflow-x: auto;
      }

      .hero {
        font-size: 24px;
        height: 180px;
      }
    }
  </style>
</head>

<body>

  <div class="navbar">
    <div class="logo">amazon</div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search Amazon">
      <button onclick="searchProduct()">Search</button>
    </div>

    <div class="nav-item">Hello, Sign in</div>
    <div class="nav-item">Returns & Orders</div>
    <div class="nav-item cart">Cart: <span id="cartCount">0</span></div>
  </div>

  <div class="menu">
    <span>☰ All</span>
    <span>Today's Deals</span>
    <span>Mobiles</span>
    <span>Fashion</span>
    <span>Electronics</span>
    <span>Home</span>
  </div>

  <div class="hero">
    Welcome to Amazon Clone
  </div>

  <div class="products" id="productList"></div>

  <footer>
    © 2026 Amazon Clone | Made with HTML, CSS and JavaScript
  </footer>

  <script>
    const products = [
      {
        name: "Smartphone",
        price: "₹14,999",
        image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500"
      },
      {
        name: "Laptop",
        price: "₹49,999",
        image: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500"
      },
      {
        name: "Headphones",
        price: "₹1,999",
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
      },
      {
        name: "Smart Watch",
        price: "₹2,499",
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
      },
      {
        name: "Shoes",
        price: "₹1,799",
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
      },
      {
        name: "Backpack",
        price: "₹999",
        image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500"
      }
    ];

    let cartCount = 0;

    function displayProducts(productArray) {
      const productList = document.getElementById("productList");
      productList.innerHTML = "";

      productArray.forEach(product => {
        productList.innerHTML += `
          <div class="card">
            <img src="${product.image}" alt="${product.name}">
            <h3>${product.name}</h3>
            <p class="price">${product.price}</p>
            <button onclick="addToCart()">Add to Cart</button>
          </div>
        `;
      });
    }

    function addToCart() {
      cartCount++;
      document.getElementById("cartCount").innerText = cartCount;
      alert("Product added to cart!");
    }

    function searchProduct() {
      const searchValue = document.getElementById("searchInput").value.toLowerCase();

      const filteredProducts = products.filter(product =>
        product.name.toLowerCase().includes(searchValue)
      );

      displayProducts(filteredProducts);
    }

    displayProducts(products);
  </script>

</body>
</html>
